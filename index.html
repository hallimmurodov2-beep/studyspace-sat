<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Studyspace SAT — a calm, adaptive Digital SAT study app: daily plan, practice, mistake review, practice tests. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAT">
<title>Studyspace SAT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
/* apply the saved theme before the first paint */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('studyspace.sat.v1') || '{}').settings || {};
    var th = s.theme || 'auto';
    if (th === 'auto') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = th;
    document.documentElement.dataset.accent = s.accent || 'blue';
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><div class="boot"><div class="boot-ring"></div></div></div>
<div id="player-root"></div>
<div id="overlays"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<noscript><p style="padding:32px;font-family:sans-serif">Studyspace SAT needs JavaScript.</p></noscript>
<script src="js/util.js"></script>
<script src="js/content/skills.js"></script>
<script src="js/content/rw.js"></script>
<script src="js/content/math.js"></script>
<script src="js/content/vocab.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/orbit.js"></script>
<script src="js/views.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
